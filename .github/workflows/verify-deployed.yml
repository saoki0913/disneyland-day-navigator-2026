name: Verify deployed Disneyland Navi
on:
  workflow_dispatch:
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://dl-navi-1031.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify deployed HTTP assets and APIs
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const root = process.env.BASE;
          const check = async (path, ms=40000) => {
            const r=await fetch(root+path,{signal:AbortSignal.timeout(ms)});
            console.log("HTTP",r.status,path,"content-type",r.headers.get("content-type"));
            assert.equal(r.status,200,path);
            return r;
          };
          for(const path of ["/","/css/app.css","/js/app.js","/js/data.js","/vendor/leaflet/leaflet.js","/fonts/oswald-latin-500-normal.woff2","/icon-180.png"]){
            const r=await check(path);
            const a=await r.arrayBuffer();
            assert.ok(a.byteLength>100, path+" "+a.byteLength);
            console.log("BYTES",a.byteLength,path);
          }
          const h=await (await check("/api/health")).json();
          assert.equal(h.ok,true);
          console.log("HEALTH",JSON.stringify(h));
          for(const path of ["/api/live","/api/live","/api/meta","/api/photos?set=rides","/api/photos?set=food","/api/photos?set=shows"]){
            const r=await fetch(root+path,{signal:AbortSignal.timeout(60000)});
            const j=await r.json().catch(()=>null);
            console.log("API",path,"http",r.status,"ok",j?.ok,"cache",j?.cache,"source",j?.source);
            if(path.startsWith("/api/live")){
              console.log("LIVE",JSON.stringify({errors:j?.errors,count:Object.keys(j?.attractions||{}).length,shows:j?.shows}));
            }else if(path==="/api/meta"){
              console.log("META",JSON.stringify({errors:j?.errors,coords:Object.keys(j?.coords||{}).length,schedule:j?.schedule}));
            }else{
              console.log("PHOTOS",JSON.stringify({set:j?.set,errors:j?.errors,ids:Object.keys(j?.photos||{}),items:Object.entries(j?.photos||{}).map(([id,p])=>({id,src:p.src,source:p.source}))}));
            }
            assert.equal(r.status,200,path);
            assert.equal(j?.ok,true,path);
          }
          '
      - name: Probe in-app walking route (/api/route → OSM foot router)
        run: |
          for q in "from=33.8110,-117.9190&to=33.8117,-117.9232" "from=33.8121,-117.9200&to=33.8155,-117.9236" "from=33.8119,-117.9184&to=33.8113,-117.9171"; do
            echo "== $q"
            curl --silent --max-time 25 "$BASE/api/route?$q" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(JSON.stringify({ok:j.ok,error:j.error,distance:j.distance,points:j.coords?.length,steps:(j.steps||[]).map(x=>[x.type,x.modifier,x.name,x.distance])}))}catch{console.log("raw:",s.slice(0,300))}})' || true
          done
      - name: Install Chromium for real deployed page E2E
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run mobile-size browser E2E on deployed URL
        run: node tests/e2e.mjs "$BASE"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-production-iphone-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 1
