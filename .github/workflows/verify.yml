name: Verify Disneyland Navi
on:
  push:
    branches: ['main']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Probe production walking route (informational, never fails)
        run: |
          for q in "from=33.8110,-117.9190&to=33.8117,-117.9232" "from=33.8121,-117.9200&to=33.8155,-117.9236" "from=33.8119,-117.9184&to=33.8113,-117.9171"; do
            echo "== $q"
            curl --silent --max-time 25 "https://dl-navi-1031.pages.dev/api/route?$q" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(JSON.stringify({ok:j.ok,error:j.error,distance:j.distance,points:j.coords?.length,steps:(j.steps||[]).map(x=>[x.type,x.modifier,x.name,x.distance])}))}catch{console.log("raw:",s.slice(0,300))}})' || true
          done
      - name: Install browser for E2E checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local Pages and run iPhone-sized E2E
        run: |
          npx wrangler pages dev public --port 8788 > /tmp/pages-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8788/ > /dev/null && break; sleep 2; done
          node tests/e2e.mjs http://127.0.0.1:8788
      - name: Upload screenshots only when explicitly requested (avoid artifact storage charges)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: navigator-e2e-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 1
