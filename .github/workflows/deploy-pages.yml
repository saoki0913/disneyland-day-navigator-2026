name: Deploy Disneyland Navi to Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy preview first, then production after verification"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
permissions:
  contents: read
concurrency:
  group: dl-navi-1031-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run 60 unit tests
        run: npm test
      - name: Check that Pages-only token is configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN. Configure a token scoped to Account / Cloudflare Pages / Edit."
            exit 1
          fi
      - name: Deploy only dl-navi-1031
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 97d97fcd567c4df4ab03b360f4cfe61d
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            BRANCH=main
          else
            BRANCH=preview
          fi
          npx wrangler pages deploy public --project-name dl-navi-1031 --branch "$BRANCH"
      - name: Smoke test deployed URL
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            BASE=https://dl-navi-1031.pages.dev
          else
            BASE=https://preview.dl-navi-1031.pages.dev
          fi
          echo "Checking $BASE"
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$BASE/" -o /dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$BASE/api/health"
          echo
