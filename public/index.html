<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0670e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Disney Navi">
<meta name="description" content="10/31 ディズニーランド・パーク／11/1 カリフォルニア・アドベンチャー当日ナビ（個人用・非公式）">
<title>Disneyland Resort Day Navi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preload" href="/fonts/mplus-rounded-1c-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="topbar__row">
      <svg class="topbar__spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3c.4 3.9 2.4 5.9 6.3 6.3-3.9.4-5.9 2.4-6.3 6.3-.4-3.9-2.4-5.9-6.3-6.3C7.6 8.9 9.6 6.9 10 3Z"/><path d="M18 13.5c.2 1.8 1.2 2.8 3 3-1.8.2-2.8 1.2-3 3-.2-1.8-1.2-2.8-3-3 1.8-.2 2.8-1.2 3-3Z"/><path d="M18.5 2.5c.15 1.2.8 1.85 2 2-1.2.15-1.85.8-2 2-.15-1.2-.8-1.85-2-2 1.2-.15 1.85-.8 2-2Z"/></svg>
      <span class="topbar__clock" id="clock">--:--</span>
      <div class="parksw" id="parkSw" role="group" aria-label="パークの切り替え"></div>
      <div class="topbar__right">
        <button class="pill" id="livePill" type="button" aria-label="待ち時間を更新">
          <span class="pill__dot"></span><span id="livePillText">確認中</span>
        </button>
        <button class="iconbtn" id="settingsBtn" type="button" aria-label="設定">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="views">
    <section class="view" id="view-home" data-view="home" aria-label="いま"></section>
    <section class="view" id="view-plan" data-view="plan" aria-label="プラン" hidden></section>
    <section class="view view--map" id="view-map" data-view="map" aria-label="マップ" hidden></section>
    <section class="view" id="view-explore" data-view="explore" aria-label="探す" hidden></section>
  </main>

  <nav class="tabbar" aria-label="メインメニュー">
    <button class="tab is-active" data-tab="home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></svg>
      <span>いま</span>
    </button>
    <button class="tab" data-tab="plan" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      <span>プラン</span>
    </button>
    <button class="tab" data-tab="map" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
      <span>マップ</span>
    </button>
    <button class="tab" data-tab="explore" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>探す</span>
    </button>
  </nav>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet__grip" data-close></div>
      <div class="sheet__body" id="sheetBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<noscript>このアプリにはJavaScriptが必要です。</noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
